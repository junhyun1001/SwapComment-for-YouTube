changelog:
  categories:
    - title: "🚀 New Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "fix"
        - "bug"
    - title: "🛠 Improvements"
      labels:
        - "refactor"
        - "performance"
  exclude:
    labels:
      - "chore"
      - "ci"
      - "documentation"
