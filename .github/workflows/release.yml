name: Release & Update Homebrew

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Universal Binary
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package Application
        id: package
        run: |
          cd build
          zip -r -y SwapComment-for-YouTube.zip "SwapComment for YouTube.app"
          SHA256=$(shasum -a 256 SwapComment-for-YouTube.zip | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/SwapComment-for-YouTube.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap Cask
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/junhyun1001/homebrew-tap.git" tap
          cd tap

          CASK_FILE="Casks/swapcomment-for-youtube.rb"
          if [ -f "$CASK_FILE" ]; then
            sed -i '' -E "s/version \"[0-9.]+\"/version \"$VERSION\"/" "$CASK_FILE"
            sed -i '' -E "s/sha256 \"[a-f0-9]+\"/sha256 \"$SHA256\"/" "$CASK_FILE"

            git add "$CASK_FILE"
            git commit -m "chore: bump swapcomment-for-youtube to $VERSION"
            git push origin main
            echo "Successfully updated Homebrew Cask to v$VERSION!"
          else
            echo "Error: Cask file not found at $CASK_FILE"
            exit 1
          fi
